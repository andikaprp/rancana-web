<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Rancana gesture review</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f3ee;color:#234634;font:15px/1.5 system-ui,sans-serif}header{padding:18px 24px;background:white;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font:500 26px Georgia;margin:0 auto 0 0}button,select,a{font:inherit;color:inherit}button,select{padding:7px 11px;border:1px solid #c2cfc6;border-radius:8px;background:#fff;cursor:pointer}main{padding:16px;overflow:auto}iframe{display:block;width:100%;height:900px;border:0;margin:auto;background:white;box-shadow:0 6px 30px #17392815}footer{padding:0 24px 24px;color:#657368}
</style><header><h1>Rancana · gesture review</h1><select id="width"><option value="100%">Desktop</option><option value="390px">390 px</option><option value="320px">320 px</option></select><select id="locale"><option value="id">ID</option><option value="en">EN</option></select><button data-scene="hero">Hero</button><button data-scene="footer">Footer</button><button data-time="0">Rest</button><button data-time="3000">Present / search</button><button data-time="6500">Discover</button><button data-time="10400">Cover</button><button data-time="14000">Peek</button><button id="play">Play</button><a href="review-sunglasses-cana.html">Sunglasses Cana ↗</a></header><main><iframe title="Actual Rancana page preview" src="id/"></iframe></main><footer>Review only. Current main layout and mobile fixes; no PR24 favicon or feature wrapper changes. Navbar remains Ranca.</footer><script>
const frame=document.querySelector('iframe');let scene='hero';const root=()=>frame.contentDocument.querySelector(scene==='hero'?'.hero-wrap':'.footer-brand-row');document.querySelector('#width').onchange=e=>frame.style.width=e.target.value;document.querySelector('#locale').onchange=e=>frame.src=e.target.value+'/';document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=b.dataset.scene;root().scrollIntoView({behavior:'instant',block:'end'});});document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>root().dispatchEvent(new frame.contentWindow.CustomEvent('companion:seek',{detail:{time:Number(b.dataset.time),paused:true}})));document.querySelector('#play').onclick=()=>root().dispatchEvent(new frame.contentWindow.CustomEvent('companion:resume'));
</script></html>
