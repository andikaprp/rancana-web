name: Plain mascot articulation early review
on:
  push:
    branches: [review/plain-mascot-articulation-20261012]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  early-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/upload-artifact@v4
        with:
          name: plain-two-arm-early-review
          path: |
            review-evidence/plain-articulation-output/
            review-evidence/plain-articulation/REVIEW-NOTES.md
  articulation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8136 --bind 127.0.0.1 > /tmp/plain-review-server.log 2>&1 &
          node check-plain-articulation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plain-articulation-ci-check
          path: review-evidence/plain-articulation-output/
