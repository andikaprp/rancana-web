name: Plain mascot unchanged scene MP4
on:
  push:
    branches: [review/plain-mascot-articulation-20261012]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify unchanged source and video integrity
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          folder = pathlib.Path('review-evidence/plain-motion-delivery')
          report = json.loads((folder / 'video-verification.json').read_text())
          assert report['sourceCommit'] == 'd9c198596a9db9400fadb9ac86ddc3c5cd708738'
          for filename, expected in report['sourceHashes'].items():
              assert hashlib.sha256(pathlib.Path(filename).read_bytes()).hexdigest() == expected, filename
          assert hashlib.sha256((folder / 'Rancana-plain-two-arm-test-4s.mp4').read_bytes()).hexdigest() == report['sha256']
          assert report['playback']['ended'] and report['playback']['duration'] == 4
          assert report['playback']['decodedFrames'] >= 119
          print('PASS: exact d9c1985 scene, verified MP4 hash and recorded full browser playback')
          PY
      - name: Decode and count video frames
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          ffmpeg -v error -i review-evidence/plain-motion-delivery/Rancana-plain-two-arm-test-4s.mp4 -f null -
          python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(['ffprobe', '-v', 'error', '-count_frames', '-select_streams', 'v:0', '-show_entries', 'stream=codec_name,pix_fmt,width,height,r_frame_rate,nb_read_frames:format=duration', '-of', 'json', 'review-evidence/plain-motion-delivery/Rancana-plain-two-arm-test-4s.mp4']))
          stream = data['streams'][0]
          assert (stream['width'], stream['height'], stream['codec_name'], stream['pix_fmt']) == (1920, 1080, 'h264', 'yuv420p')
          assert stream['r_frame_rate'] == '30/1' and int(stream['nb_read_frames']) == 120
          assert float(data['format']['duration']) == 4
          print('PASS: 120 decoded frames, 30fps, 4.000 seconds, H.264 1920x1080')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: unchanged-plain-two-arm-motion-4s
          path: review-evidence/plain-motion-delivery/
