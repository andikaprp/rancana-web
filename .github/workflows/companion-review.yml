name: Selected mascot website review
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: b66fcb0bb67e6f69524ec0a88d65a917417b8756
          path: .mascot-main-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/export-mascot-assets.mjs && git diff --exit-code -- assets/mascots/selected-A assets/mascots/ranca-header.svg
      - run: node scripts/capture-mascot-comparison.mjs --baseline=.mascot-main-baseline
      - uses: actions/upload-artifact@v4
        with:
          name: selected-A-before-after
          path: |
            review-evidence/selected-A-website/before/
            review-evidence/selected-A-website/after/
      - run: node check-selected-website-mascots.mjs
      - run: python3 scripts/package-mascot-preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-A-website-review
          path: review-evidence/selected-A-website/
