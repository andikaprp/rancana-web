name: Mobile layout review
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: d289e92315f601045326f72536178e117c27ea6f
          path: .mobile-layout-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node check-mobile-layout.mjs --baseline=.mobile-layout-baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-layout-before-after
          path: review-evidence/mobile-layout/
