name: Canonical full-character greeting review
on:
  push:
    branches: [review/canonical-greetings-20261012]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-greetings:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node check-canonical-greetings.mjs
      - run: bash review-evidence/canonical-greetings/encode.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-full-character-greetings
          path: review-evidence/canonical-greeting-output/
