name: Cana white downward lashes review
on:
  push:
    branches: [review/selected-gesture-rest-refinement-20261012]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  early-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/upload-artifact@v4
        with:
          name: cana-white-lower-lashes-review
          path: review-evidence/cana-white-lower-lashes/
          if-no-files-found: error
  verify-review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 review-evidence/cana-white-lower-lashes/build.py
          python3 -m http.server 8140 --bind 127.0.0.1 > /tmp/cana-white-lash-server.log 2>&1 &
          node check-cana-white-lower-lashes.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cana-white-lower-lashes-ci
          path: review-evidence/cana-white-lower-lashes/
