name: Single lash-free Cana study
on:
  push:
    branches: [review/selected-gesture-rest-refinement-20261012]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  early-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/upload-artifact@v4
        with:
          name: cana-lash-free-study
          path: review-evidence/cana-lash-free-study/
          if-no-files-found: error
  verify-study:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 review-evidence/cana-lash-free-study/build.py
          python3 -m http.server 8140 --bind 127.0.0.1 > /tmp/cana-lash-free-server.log 2>&1 &
          node check-cana-lash-free-study.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cana-lash-free-study-ci
          path: review-evidence/cana-lash-free-study/
