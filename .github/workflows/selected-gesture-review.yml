name: Selected Cana A design package
on:
  push:
    branches: [review/selected-gesture-rest-refinement-20261012]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selected-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/upload-artifact@v4
        with:
          name: selected-cana-A
          path: review-evidence/selected-cana-A/
          if-no-files-found: error
  verify-selected-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 review-evidence/selected-cana-A/build.py
          python3 -m http.server 8140 --bind 127.0.0.1 > /tmp/cana-eye-state-server.log 2>&1 &
          node check-selected-cana-A.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-cana-A-ci
          path: review-evidence/selected-cana-A/
