<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<title>Ranca cloud logo, reconstructed vector</title><desc>Native scalable vector reconstruction of the approved six-lobed jade cloud with happy white arc eyes and smile, keeping the approved white-background framing. Soft rim lighting is intentional; all visible artwork is vector. No embedded bitmap.</desc>
<defs>
<path id="cloud" d="M190 134 C210 63 286 39 346 75 C433 -29 627 17 645 165 C743 208 747 334 659 385 C634 506 459 564 346 455 C274 492 174 455 171 362 C69 316 81 172 190 134Z"/>
