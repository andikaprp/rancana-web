<filter id="soft-rim" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="15"/></filter>
<filter id="top-rim" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="11"/></filter>
<linearGradient id="light-fade" x1="0" y1="0" x2=".2" y2="1"><stop offset="0" stop-color="white"/><stop offset=".42" stop-color="white" stop-opacity=".55"/><stop offset=".78" stop-color="white" stop-opacity="0"/></linearGradient>
<mask id="upper-light" maskUnits="userSpaceOnUse" x="0" y="0" width="741" height="532"><rect width="741" height="532" fill="url(#light-fade)"/></mask>
</defs>
